<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁 - 宿舍洗衣預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- 導覽列 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fa-solid fa-soap text-teal-600 text-2xl mr-2"></i>
                    <span class="font-bold text-xl text-gray-800">宿舍洗衣系統</span>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-teal-600 font-medium border-b-2 border-teal-600 pb-1">狀態總覽</a>
                    <a href="reserve.html" class="text-gray-500 hover:text-teal-600 transition">預約洗衣</a>
                    <a href="my-bookings.html" class="text-gray-500 hover:text-teal-600 transition">我的預約</a>
                    <a href="report.html" class="text-gray-500 hover:text-teal-600 transition">問題回報</a>
                </div>
                <div class="flex items-center">
                    <span class="text-sm text-gray-600 mr-4">Hi, 吳同學</span>
                    <a href="login.html" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-right-from-bracket"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 歡迎區塊 -->
        <div class="bg-gradient-to-r from-teal-500 to-cyan-600 rounded-2xl p-8 mb-8 text-white shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold mb-2">早安，要洗衣服嗎？</h1>
                <p class="opacity-90">目前有 <span class="font-bold text-yellow-300 text-xl">2</span> 台洗衣機可用，無需等待！</p>
            </div>
            <a href="reserve.html" class="bg-white text-teal-600 px-6 py-3 rounded-full font-bold shadow-md hover:bg-gray-50 transition transform hover:scale-105">
                <i class="fa-solid fa-plus mr-1"></i> 立即預約
            </a>
        </div>

        <!-- 狀態標題 -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800 border-l-4 border-teal-500 pl-3">即時設備狀態</h2>
            <div class="flex space-x-4 text-sm">
                <div class="flex items-center"><span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span>可用</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-red-500 rounded-full mr-2"></span>使用中</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-yellow-400 rounded-full mr-2"></span>維修中</div>
            </div>
        </div>

        <!-- 洗衣機卡片 Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <!-- 機台 A1 (可用) -->
            <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition border border-gray-100 overflow-hidden relative group">
                <div class="absolute top-0 right-0 p-3">
                    <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded-full">可用</span>
                </div>
                <div class="p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 text-xl group-hover:bg-teal-50 group-hover:text-teal-600 transition">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <div class="ml-4">
                            <h3 class="text-lg font-bold text-gray-800">A棟 - 01號機</h3>
                            <p class="text-gray-500 text-sm">標準型 (10kg)</p>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <a href="reserve.html" class="block w-full text-center bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700 transition">預約此機台</a>
                    </div>
                </div>
            </div>

            <!-- 機台 A2 (使用中) -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden relative opacity-90">
                <div class="absolute top-0 right-0 p-3">
                    <span class="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded-full">使用中</span>
                </div>
                <div class="p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center text-red-400 text-xl animate-pulse">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                        </div>
                        <div class="ml-4">
                            <h3 class="text-lg font-bold text-gray-800">A棟 - 02號機</h3>
                            <p class="text-gray-500 text-sm">標準型 (10kg)</p>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="flex justify-between text-xs text-gray-500 mb-1">
                            <span>剩餘時間</span>
                            <span class="font-bold text-red-500">23 分鐘</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-red-500 h-2 rounded-full" style="width: 60%"></div>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <button disabled class="block w-full text-center bg-gray-100 text-gray-400 py-2 rounded-lg cursor-not-allowed">暫不可用</button>
                    </div>
                </div>
            </div>

            <!-- 機台 B1 (維修中) -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden relative">
                <div class="absolute top-0 right-0 p-3">
                    <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded-full">維修中</span>
                </div>
                <div class="p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-12 h-12 bg-yellow-50 rounded-full flex items-center justify-center text-yellow-500 text-xl">
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                        </div>
                        <div class="ml-4">
                            <h3 class="text-lg font-bold text-gray-800">B棟 - 01號機</h3>
                            <p class="text-gray-500 text-sm">滾筒式 (12kg)</p>
                        </div>
                    </div>
                    <div class="mt-4 p-3 bg-gray-50 rounded text-xs text-gray-500">
                        <i class="fa-solid fa-circle-info mr-1"></i> 管理員備註：馬達檢修中，預計 12/15 恢復。
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <button disabled class="block w-full text-center bg-gray-100 text-gray-400 py-2 rounded-lg cursor-not-allowed">暫不可用</button>
                    </div>
                </div>
            </div>

             <!-- 機台 B2 (可用) -->
             <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition border border-gray-100 overflow-hidden relative group">
                <div class="absolute top-0 right-0 p-3">
                    <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded-full">可用</span>
                </div>
                <div class="p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 text-xl group-hover:bg-teal-50 group-hover:text-teal-600 transition">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <div class="ml-4">
                            <h3 class="text-lg font-bold text-gray-800">B棟 - 02號機</h3>
                            <p class="text-gray-500 text-sm">滾筒式 (12kg)</p>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <a href="reserve.html" class="block w-full text-center bg-teal-600 text-white py-2 rounded-lg hover:bg-teal-700 transition">預約此機台</a>
                    </div>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
