<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約洗衣 - 宿舍洗衣預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    
    <!-- 簡化導覽列 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-gray-500 hover:text-teal-600 mr-4"><i class="fa-solid fa-arrow-left"></i> 返回</a>
                    <span class="font-bold text-xl text-gray-800">新增預約</span>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-500 hover:text-teal-600 transition">狀態總覽</a>
                    <a href="reserve.html" class="text-teal-600 font-medium border-b-2 border-teal-600 pb-1">預約洗衣</a>
                    <a href="my-bookings.html" class="text-gray-500 hover:text-teal-600 transition">我的預約</a>
                    <a href="report.html" class="text-gray-500 hover:text-teal-600 transition">問題回報</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row gap-8">
            
            <!-- 左側：選擇條件 -->
            <div class="w-full md:w-1/3 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">1. 選擇設備</h3>
                    <div class="space-y-3">
                        <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-teal-50 hover:border-teal-500 transition">
                            <input type="radio" name="machine" class="text-teal-600 focus:ring-teal-500" checked>
                            <div class="ml-3">
                                <span class="block font-medium text-gray-800">A棟 - 01號機</span>
                                <span class="block text-xs text-gray-500">標準型 (可用)</span>
                            </div>
                        </label>
                        <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-teal-50 hover:border-teal-500 transition">
                            <input type="radio" name="machine" class="text-teal-600 focus:ring-teal-500">
                            <div class="ml-3">
                                <span class="block font-medium text-gray-800">A棟 - 02號機</span>
                                <span class="block text-xs text-red-500">使用中</span>
                            </div>
                        </label>
                        <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-teal-50 hover:border-teal-500 transition">
                            <input type="radio" name="machine" class="text-teal-600 focus:ring-teal-500">
                            <div class="ml-3">
                                <span class="block font-medium text-gray-800">B棟 - 02號機</span>
                                <span class="block text-xs text-gray-500">滾筒式 (可用)</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">2. 選擇日期</h3>
                    <input type="date" class="w-full p-2 border rounded-lg text-gray-700 focus:ring-2 focus:ring-teal-500 outline-none" value="2025-12-12">
                </div>
            </div>

            <!-- 右側：選擇時段與確認 -->
            <div class="w-full md:w-2/3 bg-white p-6 rounded-xl shadow-sm h-fit">
                <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">3. 選擇時段 (2025/12/12)</h3>
                
                <div class="grid grid-cols-3 sm:grid-cols-4 gap-3 mb-8">
                    <!-- 時段按鈕群 -->
                    <button class="py-2 px-4 rounded-lg border border-gray-200 text-gray-400 bg-gray-100 cursor-not-allowed text-sm">08:00 (過期)</button>
                    <button class="py-2 px-4 rounded-lg border border-gray-200 text-gray-400 bg-gray-100 cursor-not-allowed text-sm">09:00 (已預約)</button>
                    <button class="py-2 px-4 rounded-lg border border-teal-600 text-teal-600 bg-teal-50 font-bold text-sm ring-2 ring-teal-400">10:00</button>
                    <button class="py-2 px-4 rounded-lg border border-gray-300 hover:border-teal-500 hover:text-teal-600 text-gray-700 text-sm transition">11:00</button>
                    <button class="py-2 px-4 rounded-lg border border-gray-300 hover:border-teal-500 hover:text-teal-600 text-gray-700 text-sm transition">12:00</button>
                    <button class="py-2 px-4 rounded-lg border border-gray-200 text-gray-400 bg-gray-100 cursor-not-allowed text-sm">13:00 (已預約)</button>
                    <button class="py-2 px-4 rounded-lg border border-gray-300 hover:border-teal-500 hover:text-teal-600 text-gray-700 text-sm transition">14:00</button>
                    <button class="py-2 px-4 rounded-lg border border-gray-300 hover:border-teal-500 hover:text-teal-600 text-gray-700 text-sm transition">15:00</button>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg mb-6">
                    <h4 class="font-bold text-gray-800 mb-2">預約摘要</h4>
                    <ul class="text-sm text-gray-600 space-y-1">
                        <li class="flex justify-between"><span>設備：</span><span class="font-bold text-gray-800">A棟 - 01號機</span></li>
                        <li class="flex justify-between"><span>日期：</span><span class="font-bold text-gray-800">2025/12/12 (五)</span></li>
                        <li class="flex justify-between"><span>時段：</span><span class="font-bold text-teal-600">10:00 - 11:00</span></li>
                    </ul>
                </div>

                <div class="flex justify-end space-x-4">
                    <a href="index.html" class="px-6 py-3 rounded-lg text-gray-500 hover:bg-gray-100 transition">取消</a>
                    <button onclick="alert('預約成功！系統已發送確認信件。')" class="px-6 py-3 rounded-lg bg-teal-600 text-white font-bold shadow-md hover:bg-teal-700 transform hover:-translate-y-1 transition">
                        確認預約
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
